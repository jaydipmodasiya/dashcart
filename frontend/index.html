<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dashcart – Furniture delivered in 30–40 minutes</title>
  <meta name="description" content="Sofas, beds, tables, chairs and more from furniture showrooms near you, delivered in 30-40 minutes.">
  <meta name="theme-color" content="#3A4FE0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233A4FE0'/%3E%3Cpath d='M8 18v-4a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v4M6 18a2 2 0 0 1 4 0v3h12v-3a2 2 0 0 1 4 0v5H6z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#shop">Skip to furniture</a>

  <header class="topbar">
    <div class="topbar-in">
      <a href="#/" class="logo" aria-label="dashcart home">
        <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M8 17v-3a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3M5 17a2 2 0 0 1 4 0v3h14v-3a2 2 0 0 1 4 0v6H5zM9 25v2M23 25v2"/></svg></span>
        <span>dashcart</span>
      </a>
      <button class="loc" id="locBtn" type="button" data-act="openLoc"></button>
      <form class="search" id="searchForm" autocomplete="off" role="search">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="searchInput" type="search" placeholder='Search "sofa", "trundle bed", "shoe rack"' aria-label="Search furniture">
      </form>
      <nav class="nav" id="nav" aria-label="Account and cart"></nav>
    </div>
  </header>

  <main id="view"></main>

  <footer class="footer">
    <div class="wrap foot-in">
      <div>
        <p class="foot-logo">dashcart</p>
        <p>Furniture from showrooms near you, delivered in 30–40 minutes.</p>
      </div>
      <p class="foot-note">This is a college project demo. Showrooms, products and payments are simulated, and no real money is charged.</p>
    </div>
  </footer>

  <div class="backdrop" id="backdrop" data-act="closeDrawer"></div>
  <aside class="drawer" id="drawer" aria-label="Shopping cart" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawerTitle">Your cart</h2>
      <button class="icon-btn" data-act="closeDrawer" aria-label="Close cart"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot"></div>
  </aside>

  <div id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
